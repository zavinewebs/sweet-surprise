<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Room Preview</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#b9b1e1}canvas{display:block;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
#gate{position:fixed;inset:0;z-index:40;overflow-y:auto;display:flex;justify-content:center;background:linear-gradient(180deg,#cfc6ec 0%,#b9b1e1 34%,#a9c2e6 72%,#9fbde4 100%);transition:opacity .9s ease;font-family:Georgia,serif}
#gate.gone{opacity:0;pointer-events:none}
#gateCard{padding:30px 22px 40px;text-align:center;width:min(94vw,470px);margin:auto 0}
#gateCard .heroImg{display:block;width:100%;border-radius:22px;box-shadow:0 24px 48px rgba(80,50,110,.35);margin:16px 0 20px}
#gateCard .kick{letter-spacing:.32em;font-size:11px;color:#6d4a78;text-transform:uppercase}
#gateCard h1{font-size:36px;line-height:1.15;color:#3d2c4b;margin:2px 0 6px;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#gateCard p{color:#5d4568;font-style:italic;margin:4px 0 14px;font-size:16px}
#cd{display:flex;gap:8px;justify-content:center;margin:10px 0 18px}
#cd div{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:8px 0;width:64px}
#cd b{display:block;font-size:26px;color:#43304e;font-variant-numeric:tabular-nums}
#cd span{font-size:10px;letter-spacing:.2em;color:#9a6a8f}
#openBtn{font-family:Georgia,serif;letter-spacing:.22em;font-size:13px;color:#fff;background:#8aa8d8;border:none;padding:14px 34px;border-radius:999px;box-shadow:0 10px 24px rgba(90,110,180,.4)}
#openBtn.ready{background:#5b84c4;animation:pu 2.2s ease-in-out infinite;cursor:pointer}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;font-family:Georgia,serif}
#actionBtn{position:absolute;right:18px;bottom:92px;pointer-events:auto;font-family:Georgia,serif;font-size:16px;color:#fff;background:#e2607e;border:none;padding:16px 24px;border-radius:999px;box-shadow:0 12px 26px rgba(190,60,100,.45);display:none;cursor:pointer}
#toast{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:rgba(255,250,240,.94);color:#6b3a52;padding:11px 24px;border-radius:999px;font-size:16px;box-shadow:0 10px 24px rgba(90,50,80,.25);opacity:0;transition:opacity .4s;white-space:nowrap}
#joyBase{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.65);display:none}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.25);display:none}
#musicBtn{position:absolute;right:16px;top:16px;pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.85);font-size:18px;cursor:pointer}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;font-family:Georgia,serif;font-size:15px;letter-spacing:.04em;color:#6b3a52;background:rgba(255,250,240,.88);padding:9px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(90,50,80,.25);pointer-events:none;white-space:nowrap}</style>
</head><body>
<div id="gate"><div id="gateCard">
<div class="kick">A birthday gift &nbsp;·&nbsp; Tonight, 12:00</div>
<img class="heroImg" src="hero.jpg" alt="">
<h1>Something sweet<br>is on its way</h1>
<p>for someone very special, wait till the clock says 12</p>
<div id="cd"><div><b id="cdH">00</b><span>HOURS</span></div><div><b id="cdM">00</b><span>MINUTES</span></div><div><b id="cdS">00</b><span>SECONDS</span></div></div>
<button id="openBtn">NOT YET, WAIT TILL 12</button>
</div></div>

</div>

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
const floorTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#e9d3b8';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle=i%2?'#ecd8bf':'#e5ccab';g.fillRect(0,i*64,w,64);g.fillStyle='rgba(160,120,80,.35)';g.fillRect(0,i*64,w,2);}});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(2,2);

 g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.arc(256,265,88,0,7); g.fill();
 g.beginPath(); g.moveTo(96,640); g.bezierCurveTo(120,430,392,430,416,640); g.closePath(); g.fill();
 g.fillStyle='#7a4a63'; g.font='600 44px Georgia,serif'; g.textAlign='center'; g.fillText('HER PHOTO',256,530);
 g.font='italic 30px Georgia,serif'; g.fillStyle='#8a5a74'; g.fillText('goes here',256,572);});
const bannerTex=canvasTex(1600,200,(g,w,h)=>{g.clearRect(0,0,w,h);g.textAlign='center';g.font='700 118px Georgia,serif';
 const word='HAPPY BIRTHDAY'; const cols=['#e2607e','#5b84c4','#8a68c8','#e2607e','#5b84c4','#8a68c8','#e2607e','#5b84c4','#8a68c8','#e2607e','#5b84c4','#8a68c8','#e2607e','#5b84c4'];
 let x=w/2-g.measureText(word).width/2; g.textAlign='left';
 for(let i=0;i<word.length;i++){g.fillStyle=cols[i%cols.length];g.fillText(word[i],x,140);x+=g.measureText(word[i]).width;}});
const nameTex=canvasTex(1024,160,(g,w,h)=>{g.clearRect(0,0,w,h);g.textAlign='center';g.font='italic 92px Georgia,serif';g.fillStyle='#a03a58';g.fillText('for  Jefrina',512,105);});
const nightTex=canvasTex(512,640,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1d2a55');gr.addColorStop(1,'#40548f');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<90;i++){g.fillStyle=`rgba(255,255,255,${0.4+rnd()*0.6})`;g.beginPath();g.arc(rnd()*w,rnd()*h,rnd()*2+0.6,0,7);g.fill();}
 g.fillStyle='#f6ecd2';g.beginPath();g.arc(385,130,52,0,7);g.fill();g.fillStyle='#1d2a55';g.beginPath();g.arc(410,112,46,0,7);g.fill();});

plane(7,3.4,M(0x9fbde4,0.95),0,1.7,-3.5);                                                                  // back accent wall (soft blue)

const rug2=new THREE.Mesh(new THREE.CircleGeometry(1.18,48),M(0xfceef3,1)); rug2.rotation.x=-Math.PI/2; rug2.position.set(0,0.02,-1.35); room.add(rug2);

[[0,0.95,1.62,0.09],[0,-0.95,1.62,0.09],[-0.79,0,0.09,1.98],[0.79,0,0.09,1.98],[0,0,1.56,0.06],[0,0,0.06,1.86]].forEach(([x,y,w,h])=>{const f=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.07),frameMat);f.position.set(x,y,0.02);winG.add(f);});

const fr=new THREE.Mesh(new THREE.BoxGeometry(0.98,1.26,0.06),gold); fr.castShadow=true; photoG.add(fr);

const pho=new THREE.Mesh(new THREE.PlaneGeometry(0.74,1.0),new THREE.MeshStandardMaterial({map:photoTex,roughness:0.7})); pho.position.z=0.045; photoG.add(pho);
// banner + name above photo
const banner=new THREE.Mesh(new THREE.PlaneGeometry(3.6,0.45),new THREE.MeshBasicMaterial({map:bannerTex,transparent:true})); banner.position.set(0.35,2.98,-3.47); room.add(banner);
const nameP=new THREE.Mesh(new THREE.PlaneGeometry(1.9,0.3),new THREE.MeshBasicMaterial({map:nameTex,transparent:true})); nameP.position.set(-2.05,1.3,-3.47); room.add(nameP);

// table
const table=new THREE.Group(); table.position.set(0,0,-1.45); room.add(table);
const cloth=new THREE.Mesh(new THREE.CylinderGeometry(0.86,0.99,0.75,40),M(0xfff6ec,0.95)); cloth.position.y=0.4; cloth.castShadow=true; cloth.receiveShadow=true; table.add(cloth);
const ttop=new THREE.Mesh(new THREE.CylinderGeometry(0.88,0.88,0.05,40),M(0xfffaf2,0.8)); ttop.position.y=0.78; ttop.receiveShadow=true; table.add(ttop);

const cake=new THREE.Group(); cake.position.set(0,0.805,-1.32); scene.add(cake);
const plate=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.55,0.04,40),M(0xf2c96d,0.35,0.3)); plate.position.y=0.02; cake.add(plate);

const drip1=new THREE.Mesh(new THREE.CylinderGeometry(0.515,0.515,0.09,40),M(0xf7a8c4,0.5)); drip1.position.y=0.32; cake.add(drip1);
const tier2=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.26,40),M(0xfff8f2,0.55)); tier2.position.y=0.47; tier2.castShadow=true; cake.add(tier2);
const drip2=new THREE.Mesh(new THREE.CylinderGeometry(0.375,0.375,0.08,40),M(0xa9c6ea,0.5)); drip2.position.y=0.58; cake.add(drip2);
// meringue spikes around top
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const spike=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.16,10),M(i%2?0xf7a8c4:0x93b8e8,0.5));spike.position.set(Math.cos(a)*0.3,0.68,Math.sin(a)*0.3);cake.add(spike);}
// gold horn + ears
const horn=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.42,14),M(0xe8b64c,0.3,0.3)); horn.position.set(0,0.88,0); horn.rotation.z=-0.12; cake.add(horn);
[-1,1].forEach(s=>{const ear=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,10),M(0xf7a8c4,0.5));ear.position.set(s*0.17,0.76,0);ear.rotation.z=s*-0.35;cake.add(ear);});
// closed eyes on front of tier1
[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.011,8,20,Math.PI),M(0x333333,0.5));eye.position.set(s*0.16,0.22,0.5);eye.rotation.z=Math.PI;cake.add(eye);});
const blushL=new THREE.Mesh(new THREE.CircleGeometry(0.045,16),M(0xf9b8cd,0.6)); blushL.position.set(-0.3,0.14,0.5); cake.add(blushL);
const blushR=blushL.clone(); blushR.position.x=0.3; cake.add(blushR);
// candles + flames
const flames=[];
for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2+0.3;const cx=Math.cos(a)*0.21,cz=Math.sin(a)*0.21;
 const cd=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.17,8),M(i%2?0xf7a8c4:0xffffff,0.5));cd.position.set(cx,0.68,cz);cake.add(cd);
 const fl=new THREE.Mesh(new THREE.SphereGeometry(0.032,10,10),new THREE.MeshBasicMaterial({color:0xffc93e}));fl.scale.set(1,1.9,1);fl.position.set(cx,0.83,cz);cake.add(fl);flames.push(fl);
 const halo=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10),new THREE.MeshBasicMaterial({color:0xff9d2e,transparent:true,opacity:0.28}));halo.position.copy(fl.position);cake.add(halo);}
// plates + flowers on table
[-0.78,0.78].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.13,0.03,24),M(0xffffff,0.4));p.position.set(x*0.72,0.83,-1.12);scene.add(p);});
const vase=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,0.2,14),M(0x93b8e8,0.4)); vase.position.set(0.58,0.91,-1.78); scene.add(vase);
for(let i=0;i<6;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,10),M(i%2?0xf2608a:0xf7a8c4,0.6));f.position.set(0.72+(rnd()-0.5)*0.16,1.08+rnd()*0.1,-1.78+(rnd()-0.5)*0.14);scene.add(f);}

function balloons(x,z,cols){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 cols.forEach((c,i)=>{const bx=(rnd()-0.5)*0.5,bz=(rnd()-0.5)*0.4,by=2.15+rnd()*0.55;

  const pts=[new THREE.Vector3(bx,by-0.38,bz),new THREE.Vector3(bx*0.6,by-0.95,bz*0.6),new THREE.Vector3(0,1.25,0)];
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(...pts).getPoints(14)),new THREE.LineBasicMaterial({color:0xffffff}));g.add(line);});
 balloonGroups.push(g); return g;}

// bunting across back top corners
function bunting(x1,x2,y,z){const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(x1,y,z),new THREE.Vector3((x1+x2)/2,y-0.34,z),new THREE.Vector3(x2,y,z));
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),new THREE.LineBasicMaterial({color:0xffffff}));scene.add(line);
 for(let i=1;i<11;i++){const p=curve.getPoint(i/11);const shape=new THREE.Shape();shape.moveTo(-0.11,0);shape.lineTo(0.11,0);shape.lineTo(0,-0.24);shape.closePath();

    jefrina.rotation.y=Math.atan2(0-jefrina.position.x,-1.32-jefrina.position.z);faceTarget=jefrina.rotation.y;

}
function angLerp(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
function giftUpdate(dt,t){
  elapsedNow=t;
  if(toastEl.style.opacity==='1'&&t>toastUntil)toastEl.style.opacity='0';
  // opening -> swing after 4s
  if(mode==='opening'&&t-swingT0>4)startSwing();
  if(mode==='swing'){
    const p=Math.min(1,(t-swingT0)/1.6), e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    jefrina.rotation.y=angLerp(0,Math.PI,e);
    const goal=new THREE.Vector3(jefrina.position.x+Math.sin(0)*distT,1.95,jefrina.position.z+Math.cos(0)*distT);
    camera.position.lerpVectors(new THREE.Vector3(0,1.78,3.35),goal,e);
    const look=new THREE.Vector3().lerpVectors(new THREE.Vector3(0,1.0,-1.25),new THREE.Vector3(jefrina.position.x,1.3,jefrina.position.z),e);
    camera.lookAt(look); camSmooth.copy(camera.position);
    if(p>=1){mode='tpp';showToast('Walk Jefrina to the cake',4);}
    return;
  }
  if(mode!=='tpp'&&mode!=='cutting')return;
  // movement (tpp only)
  if(mode==='tpp'){
    let ix=joyVec.x, iz=-joyVec.y;
    if(keys['w']||keys['arrowup'])iz+=1; if(keys['s']||keys['arrowdown'])iz-=1;
    if(keys['a']||keys['arrowleft'])ix-=1; if(keys['d']||keys['arrowright'])ix+=1;
    const F={x:-Math.sin(yaw),z:-Math.cos(yaw)}, R={x:-F.z,z:F.x};
    const mv={x:F.x*iz+R.x*ix, z:F.z*iz+R.z*ix}; const ml=Math.hypot(mv.x,mv.z);
    if(ml>0.12){mv.x/=ml;mv.z/=ml;const sp=1.55*dt;
      let nx=jefrina.position.x+mv.x*sp, nz=jefrina.position.z+mv.z*sp;
      nx=Math.max(-3.0,Math.min(3.0,nx)); nz=Math.max(-3.0,Math.min(3.05,nz));
      let dx=nx-0,dz=nz-(-1.38),d=Math.hypot(dx,dz); if(d<1.18){nx=0+dx/d*1.18;nz=-1.38+dz/d*1.18;}
      dx=nx-(-0.92);dz=nz-0.45;d=Math.hypot(dx,dz); if(d<0.44&&d>0.001){nx=-0.92+dx/d*0.44;nz=0.45+dz/d*0.44;}
      jefrina.position.x=nx;jefrina.position.z=nz;
      faceTarget=Math.atan2(mv.x,mv.z);
      walkPhase+=dt*9;
      jefrina.position.y=Math.abs(Math.sin(walkPhase))*0.05;
      jefrina.userData.armL.rotation.x=Math.sin(walkPhase)*0.55;
      jefrina.userData.armR.rotation.x=-Math.sin(walkPhase)*0.55;
    } else {
      jefrina.position.y*=0.8;
      jefrina.userData.armL.rotation.x*=0.85; jefrina.userData.armR.rotation.x*=0.85;
    }
    jefrina.rotation.y=angLerp(jefrina.rotation.y,faceTarget,1-Math.exp(-10*dt));
    // action context
    const dC=Math.hypot(jefrina.position.x-0,jefrina.position.z-(-1.32));
    const dP=Math.hypot(jefrina.position.x-(-1.62),jefrina.position.z-(-2.85));
    const dG=Math.hypot(jefrina.position.x-2.45,jefrina.position.z-(-2.45));
    currentAction=(!cutDone&&dC<1.6)?'cut':(dP<1.5?'photo':(dG<1.45?'gift':null));
    if(currentAction){actionBtn.style.display='block';actionBtn.textContent=currentAction==='cut'?'CUT THE CAKE':currentAction==='photo'?'LOOK AT PHOTO':'OPEN GIFT';}
    else actionBtn.style.display='none';
  }
  // TPP camera follow
  const ce=Math.cos(pitch);
  const goal=new THREE.Vector3(jefrina.position.x+Math.sin(yaw)*ce*distT, jefrina.position.y+1.15+Math.sin(pitch)*distT, jefrina.position.z+Math.cos(yaw)*ce*distT);
  camSmooth.lerp(goal,1-Math.exp(-6*dt));
  camera.position.set(Math.max(-3.25,Math.min(3.25,camSmooth.x)),Math.max(0.5,Math.min(3.15,camSmooth.y)),Math.max(-3.25,Math.min(3.3,camSmooth.z)));
  camera.lookAt(jefrina.position.x,jefrina.position.y+1.3,jefrina.position.z);
  // cutting sequence
  if(mode==='cutting'){
    const p=t-cutT0;
    const ks=p<0.25?0:Math.min(1,(p-0.25)/0.85), ke=ks<0.5?2*ks*ks:1-Math.pow(-2*ks+2,2)/2;
    knife.position.set(0.22,2.25-ke*0.62,-1.02); knife.rotation.z=-0.15;
    if(p>1.15&&!sliceOut){sliceOut=true;sliceG.visible=true;}
    if(sliceOut&&p<2.1){const sp2=Math.min(1,(p-1.15)/0.9);sliceG.position.set(0+sp2*0.35,0.83,-1.32+sp2*0.85);}
    if(p>2.0&&!blown){blown=true;cutDone=true;flames.forEach(f=>f.visible=false);
      smokeG.visible=true;smokeUntil=t+1.8;burst(0,1.9,-1.32);
      if(songEl)songEl.play().catch(()=>{});
      clapUntil=t+3.2;showToast('Happy Birthday, Jefrina!',3.5);}
    if(p>2.8){mode='tpp';knife.visible=false;showToast('The room is yours, go explore',3.5);}
  }
  if(blown)candleLight.intensity=2.5;
  if(t<smokeUntil){smokeG.position.y=1.78+(t-(smokeUntil-1.8))*0.35;smokeMats.forEach((m,i)=>m.opacity=0.5*(1-(t-(smokeUntil-1.8))/1.8));}
  else smokeG.visible=false;
  if(t<clapUntil){ashfan.userData.armL.rotation.x=-1.15+Math.sin(t*14)*0.3;ashfan.userData.armR.rotation.x=-1.15-Math.sin(t*14)*0.3;}
  else if(mode==='tpp'||mode==='cutting'){ashfan.userData.armL.rotation.x*=0.9;ashfan.userData.armR.rotation.x*=0.9;}
  if(Math.abs(t-giftJumpT)<0.6){/* gift bounce handled by burst */}
  burstPool.forEach(b=>{if(b.life>0){b.life-=dt;b.m.position.addScaledVector(b.vel,dt);b.vel.y-=3.4*dt;b.m.rotation.x+=dt*4;b.m.rotation.y+=dt*3;if(b.life<=0)b.m.visible=false;}});
}

  balloonGroups.forEach((g,i)=>{g.rotation.z=Math.sin(t*0.7+i*2)*0.03;g.position.y=Math.sin(t*0.9+i*1.3)*0.04;});
  bulbs.forEach((b,i)=>{const s=0.75+0.45*Math.abs(Math.sin(t*1.6+i*0.55));b.scale.setScalar(s);});
  sparks.forEach((s,i)=>{const a=t*0.55+i/16*Math.PI*2;s.position.set(Math.cos(a)*0.76,1.44+Math.sin(t*1.3+i)*0.14,-1.32+Math.sin(a)*0.76);});
  jefrina.position.y=Math.sin(t*1.4)*0.012; ashfan.position.y=Math.sin(t*1.4+1)*0.012;
  ashfan.userData.armR.rotation.x=Math.sin(t*2.6)*0.35;
  const dt=Math.min(0.05,t-__lastT); __lastT=t;
  if(mode==='gate'||mode==='opening') applyCamera();
  giftUpdate(dt,t);
  renderer.render(scene,camera);
}
const q=new URLSearchParams(location.search).get('t');
if(q!==null){frame(parseFloat(q));window.__ready=true;}
else{const clock=new THREE.Clock();renderer.setAnimationLoop(()=>frame(clock.getElapsedTime()));}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
